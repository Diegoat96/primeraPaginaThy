<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #38bdf8);
            padding: 20px;
        }

        /* ── Botón cerrar sesión flotante ── */
        .boton-logout {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #dc2626, #ef4444);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 16px rgba(220, 38, 38, 0.35);
            z-index: 999;
        }

        .boton-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(220, 38, 38, 0.45);
        }

        .boton-logout:active {
            transform: scale(0.97);
        }


        .contenedor {
            width: 100%;
            max-width: 420px;
        }

        .tarjeta {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            padding: 35px 30px;
            text-align: center;
            animation: aparecer 0.6s ease;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .titulo {
            font-size: 30px;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .acciones {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .boton {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            text-decoration: none;
            text-align: center;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
        }

        .boton:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px rgba(37, 99, 235, 0.35);
        }

        .boton:active {
            transform: scale(0.98);
        }

        @media (max-width: 480px) {
            .tarjeta { padding: 28px 22px; }
            .titulo  { font-size: 25px; }
        }
    </style>
</head>
<body>


<form th:action="@{/logout}" method="post" style="position: fixed; top: 20px; right: 20px; z-index: 999;">
    <button class="boton-logout">Cerrar sesión</button>
</form>

<div class="contenedor">
    <div class="tarjeta">
        <h1 class="titulo">Home</h1>
        <div class="acciones">
            <a class="boton" th:href="@{/datos}">Datos</a>
            <a class="boton" th:href="@{/usuario}">Usuario</a>
            <a class="boton" th:href="@{/biografia}">Biografia</a>
            <a class="boton" th:href="@{/amigos}">Amigos</a>
        </div>
    </div>
</div>

</body>
</html>
